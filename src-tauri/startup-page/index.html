<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Styleprint</title>
    <!--
      Shown by the desktop shell (src-tauri/src/main.rs) while the bundled
      server starts; the window then navigates to the server's own URL. If the
      server can't start, the shell hands this page the reason through
      window.__STYLEPRINT_STARTUP_ERROR__ / window.showStartupError().
    -->
    <style>
      :root {
        --bg: #faf8f5;
        --fg: #1f1d1a;
        --muted: #6b665f;
        --accent: #b4532a;
        --panel: #efebe5;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1b1a18;
          --fg: #ece8e2;
          --muted: #a39d94;
          --accent: #e0835a;
          --panel: #26241f;
        }
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main {
        max-width: 560px;
        margin: 0 auto;
        padding: 15vh 24px 24px;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 8px;
      }
      p {
        margin: 0 0 12px;
        color: var(--muted);
      }
      .spinner {
        width: 22px;
        height: 22px;
        border: 3px solid var(--panel);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
        margin-bottom: 16px;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      pre {
        background: var(--panel);
        padding: 12px;
        border-radius: 6px;
        font-size: 12px;
        white-space: pre-wrap;
        word-break: break-word;
        max-height: 40vh;
        overflow: auto;
      }
      #error {
        display: none;
      }
      body.failed #starting {
        display: none;
      }
      body.failed #error {
        display: block;
      }
      a {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <main>
      <section id="starting">
        <div class="spinner" aria-hidden="true"></div>
        <h1>Starting Styleprint…</h1>
      </section>
      <section id="error" role="alert">
        <h1>Styleprint couldn't start</h1>
        <p id="error-message"></p>
        <p id="error-help"></p>
        <p>
          If this keeps happening, please report it at
          <a href="https://github.com/MH1044/styleprint/issues">github.com/MH1044/styleprint/issues</a>
          with the details below.
        </p>
        <pre id="error-details"></pre>
      </section>
    </main>
    <script>
      window.showStartupError = function (error) {
        document.getElementById("error-message").textContent = error.message || "";
        document.getElementById("error-help").textContent = error.help || "";
        document.getElementById("error-details").textContent = error.details || "(no further details)";
        document.body.classList.add("failed");
      };
      if (window.__STYLEPRINT_STARTUP_ERROR__) window.showStartupError(window.__STYLEPRINT_STARTUP_ERROR__);
    </script>
  </body>
</html>
