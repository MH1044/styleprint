name: Desktop Release

# Builds the Tauri desktop installers for Windows and macOS (universal:
# arm64 + x64 in one .dmg/.app). Each ships its own Node.js runtime, so users
# don't need one installed. Every installer is then installed on the runner
# and the installed copy is checked for real, with no system Node.js on PATH,
# before anything is uploaded or released. Triggers on a version tag, or
# manually via workflow_dispatch for a test run without cutting a release.
#
# macOS builds are ad-hoc signed, not notarized (no Apple Developer account):
# Gatekeeper warns the first time the app is opened. See README.md.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

jobs:
  bundle-server:
    # The server bundle (esbuild output + better-sqlite3, which ships
    # prebuilt native binaries for every platform/arch inside the npm
    # package itself) is platform-agnostic. Build it once, reuse it for
    # every OS's Tauri build below, instead of repeating this per-platform.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The npm bundled with setup-node's Node 22 still runs the classic
      # implicit `node-gyp rebuild` for any package with a binding.gyp and no
      # declared install script (better-sqlite3 has neither "install" nor
      # "postinstall" — it ships prebuilt binaries instead). A newer npm skips
      # that implicit rebuild by default; pinned to the version verified
      # locally to do so, rather than trusting it stays true on `latest`.
      - run: npm install -g npm@11.19.0
      - run: npm ci
      - run: npm run build -w web
      - run: npm run bundle:desktop -w server
      - uses: actions/upload-artifact@v4
        with:
          name: server-resources
          path: src-tauri/resources

  build-desktop:
    needs: bundle-server
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            rust-targets: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - run: npm install -g npm@11.19.0
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: server-resources
          path: src-tauri/resources
      # The Node.js runtime the app ships (a Tauri sidecar). For the universal
      # macOS build this joins the arm64 and x64 runtimes with lipo.
      - run: node scripts/fetch-node.mjs --target ${{ matrix.target }}
      - run: npx tauri build --target ${{ matrix.target }}
      - run: npx playwright install chromium

      - name: Install and check the Windows installers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          function Test-Installed([string]$exe) {
            # System Node.js off PATH, so only the bundled runtime can work.
            $savedPath = $env:PATH
            $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
            $env:STYLEPRINT_SMOKE_TEST = '1'
            try {
              $p = Start-Process $exe -Wait -PassThru -NoNewWindow `
                -RedirectStandardOutput "$env:RUNNER_TEMP\smoke-out.txt" -RedirectStandardError "$env:RUNNER_TEMP\smoke-err.txt"
            } finally {
              $env:PATH = $savedPath
              Remove-Item Env:STYLEPRINT_SMOKE_TEST
            }
            Get-Content "$env:RUNNER_TEMP\smoke-out.txt", "$env:RUNNER_TEMP\smoke-err.txt"
            if ($p.ExitCode -ne 0) { throw "smoke test failed for $exe (exit $($p.ExitCode))" }
          }

          $nsis = Get-ChildItem src-tauri/target -Recurse -Filter '*-setup.exe' | Where-Object FullName -like '*\bundle\nsis\*' | Select-Object -First 1
          $msi = Get-ChildItem src-tauri/target -Recurse -Filter '*.msi' | Where-Object FullName -like '*\bundle\msi\*' | Select-Object -First 1
          # Both installers record where they installed under this key: the MSI
          # as "InstallDir", the NSIS installer as the default value. The MSI
          # also reuses an NSIS install's folder, so it goes first, on a clean
          # machine, to test its own default location.
          $key = 'HKCU:\Software\styleprint\Styleprint'

          Write-Host "Installing $($msi.Name)"
          $p = Start-Process msiexec -ArgumentList '/i', "`"$($msi.FullName)`"", '/qn', '/norestart' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "MSI installer exited $($p.ExitCode)" }
          $msiDir = (Get-ItemProperty $key -Name InstallDir).InstallDir
          Write-Host "MSI installed to $msiDir"
          Test-Installed (Join-Path $msiDir 'styleprint.exe')

          Write-Host "Installing $($nsis.Name)"
          $p = Start-Process $nsis.FullName -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "NSIS installer exited $($p.ExitCode)" }
          $nsisDir = (Get-ItemProperty $key).'(default)'
          Write-Host "NSIS installed to $nsisDir"
          Test-Installed (Join-Path $nsisDir 'styleprint.exe')

          node scripts/e2e-installed.mjs (Join-Path $nsisDir 'node.exe') (Join-Path $nsisDir 'server\index.mjs')
          if ($LASTEXITCODE -ne 0) { throw "end-to-end test against the installed copy failed" }

      - name: Install and check the macOS app
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          dmg=$(find src-tauri/target -path '*/bundle/dmg/*.dmg' | head -1)
          mount="$RUNNER_TEMP/styleprint-dmg"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$dmg"
          cp -R "$mount/Styleprint.app" "$RUNNER_TEMP/"
          hdiutil detach "$mount"
          app="$RUNNER_TEMP/Styleprint.app"

          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | grep -E '^(Identifier|Signature|Format)'
          lipo -info "$app/Contents/MacOS/styleprint" "$app/Contents/MacOS/node"

          # System Node.js off PATH, so only the bundled runtime can work.
          smoke() { env -i HOME="$HOME" TMPDIR="${TMPDIR:-/tmp}" PATH=/usr/bin:/bin STYLEPRINT_SMOKE_TEST=1 "$@"; }
          smoke "$app/Contents/MacOS/styleprint"
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            echo "Intel (x86_64) half, under Rosetta 2:"
            smoke arch -x86_64 "$app/Contents/MacOS/styleprint"
          else
            echo "::warning::Rosetta 2 is not available on this runner, so the Intel half of the universal app was not run."
          fi

          node scripts/e2e-installed.mjs "$app/Contents/MacOS/node" "$app/Contents/Resources/server/index.mjs"

      - name: Keep the end-to-end trace if a check failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ matrix.platform }}
          path: web/test-results
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: styleprint-${{ matrix.platform }}
          path: |
            src-tauri/target/**/bundle/**/*.dmg
            src-tauri/target/**/bundle/**/*.app
            src-tauri/target/**/bundle/**/*.exe
            src-tauri/target/**/bundle/**/*.msi
          if-no-files-found: error

  create-release:
    # Only on an actual version tag (workflow_dispatch test runs never
    # create a public release). The .app is a directory, not a single file,
    # and it's already inside the .dmg next to it, so only installer files
    # get attached.
    needs: build-desktop
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: styleprint-*
          path: dist
          merge-multiple: true
      - run: find dist -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.msi' \) -print
      - run: |
          FILES=$(find dist -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.msi' \))
          gh release create "${{ github.ref_name }}" $FILES \
            --title "Styleprint ${{ github.ref_name }}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
