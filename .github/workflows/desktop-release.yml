name: Desktop Release

# Builds the Tauri desktop installer for Windows and macOS (universal:
# arm64 + x64 in one .dmg/.app). Triggers on a version tag, or manually via
# workflow_dispatch for a test run without cutting a release.
#
# Unsigned on macOS for now (no Apple Developer account configured): the
# built .app/.dmg will show Gatekeeper's "can't be opened" warning until a
# user right-clicks -> Open once, or runs `xattr -cr`. See README.md.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

jobs:
  bundle-server:
    # The server bundle (esbuild output + better-sqlite3, which ships
    # prebuilt native binaries for every platform/arch inside the npm
    # package itself) is platform-agnostic. Build it once, reuse it for
    # every OS's Tauri build below, instead of repeating this per-platform.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The npm bundled with setup-node's Node 22 still runs the classic
      # implicit `node-gyp rebuild` for any package with a binding.gyp and no
      # declared install script (better-sqlite3 has neither "install" nor
      # "postinstall" — it ships prebuilt binaries instead). A newer npm skips
      # that implicit rebuild by default; pinned to the version verified
      # locally to do so, rather than trusting it stays true on `latest`.
      - run: npm install -g npm@11.19.0
      - run: npm ci
      - run: npm run build -w web
      - run: npm run bundle:desktop -w server
      - uses: actions/upload-artifact@v4
        with:
          name: server-resources
          path: src-tauri/resources

  build-desktop:
    needs: bundle-server
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            tauri-args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: windows-latest
            tauri-args: ""
            rust-targets: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - run: npm install -g npm@11.19.0
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: server-resources
          path: src-tauri/resources
      - run: npx tauri build ${{ matrix.tauri-args }}
      - uses: actions/upload-artifact@v4
        with:
          name: styleprint-${{ matrix.platform }}
          path: |
            src-tauri/target/**/bundle/**/*.dmg
            src-tauri/target/**/bundle/**/*.app
            src-tauri/target/**/bundle/**/*.exe
            src-tauri/target/**/bundle/**/*.msi
          if-no-files-found: error

  create-release:
    # Only on an actual version tag (workflow_dispatch test runs never
    # create a public release). The .app is a directory, not a single file,
    # and it's already inside the .dmg next to it, so only installer files
    # get attached.
    needs: build-desktop
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: styleprint-*
          path: dist
          merge-multiple: true
      - run: find dist -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.msi' \) -print
      - run: |
          FILES=$(find dist -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.msi' \))
          gh release create "${{ github.ref_name }}" $FILES \
            --title "Styleprint ${{ github.ref_name }}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
